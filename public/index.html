<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rx Label Search</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #555; font-size: 0.9rem; margin-bottom: 20px; }
  section { margin-bottom: 28px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  textarea { min-height: 90px; font-family: inherit; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .terms { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .term-chip { border: 1px solid #999; border-radius: 14px; padding: 3px 10px; font-size: 0.82rem; cursor: pointer; user-select: none; }
  .term-chip.selected { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .op-toggle { font-size: 0.85rem; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
  th, td { text-align: left; border-bottom: 1px solid #eee; padding: 6px 4px; vertical-align: top; }
  .hit-tags span, .tag-pill { display: inline-block; background: #eef; border-radius: 8px; padding: 1px 6px; margin: 1px; font-size: 0.75rem; }
  .alert { border-left: 4px solid #c00; background: #fff4f4; padding: 8px 10px; margin: 8px 0; border-radius: 4px; }
  .alert.tier-4 { border-left-color: #999; background: #f7f7f7; }
  .alert.tier-3 { border-left-color: #d90; background: #fff9ef; }
  .alert.tier-2 { border-left-color: #c40; }
  .alert.tier-1 { border-left-color: #900; }
  .alert .member { font-size: 0.85rem; margin-top: 4px; }
  .notice { font-size: 0.8rem; color: #444; background: #f2f2f2; padding: 10px; border-radius: 6px; margin-top: 16px; }
  .unresolved { color: #a30; font-size: 0.85rem; }
  #search-results, #check-results { margin-top: 14px; }
  a { color: #135; }
</style>
</head>
<body>
<h1>Rx Label Search</h1>
<div class="subtitle" id="build-date-line">FDA prescription drug label search, tagging, and interaction checker. Loading build date&hellip;</div>

<section>
  <h2>Search</h2>
  <label for="search-box">Keyword search</label>
  <input type="text" id="search-box" placeholder="e.g. muscle spasm">
  <div class="terms" id="term-filters"></div>
  <div class="op-toggle">
    Combine selected terms with:
    <label style="display:inline"><input type="radio" name="operator" value="AND" checked> AND</label>
    <label style="display:inline"><input type="radio" name="operator" value="OR"> OR</label>
  </div>
  <button id="search-button">Search</button>
  <div id="search-results"></div>
</section>

<section>
  <h2>Interaction checker</h2>
  <label for="med-box">Medication list (comma, semicolon, or new-line separated)</label>
  <textarea id="med-box" placeholder="10 mg Zyprexa X 1 daily, 20 mg adderall X 3 daily, ..."></textarea>
  <button id="check-button">Check interactions</button>
  <div id="check-results"></div>
</section>

<div class="notice" id="notice-line"></div>

<script>
const state = { selectedTerms: new Set() };

async function loadTerms() {
  const res = await fetch('/api/search?terms_only=1');
  const data = await res.json();
  document.getElementById('build-date-line').textContent =
    'FDA prescription drug label search, tagging, and interaction checker. Build date: ' + data.build_date + '.';
  const container = document.getElementById('term-filters');
  container.innerHTML = '';
  for (const term of data.available_terms) {
    const chip = document.createElement('span');
    chip.className = 'term-chip';
    chip.textContent = term.term_id + ' ' + term.name;
    chip.dataset.termId = term.term_id;
    chip.addEventListener('click', () => {
      if (state.selectedTerms.has(term.term_id)) { state.selectedTerms.delete(term.term_id); chip.classList.remove('selected'); }
      else { state.selectedTerms.add(term.term_id); chip.classList.add('selected'); }
    });
    container.appendChild(chip);
  }
}

function tierClass(tier) {
  return tier ? 'tier-' + tier : 'tier-4';
}

async function runSearch() {
  const q = document.getElementById('search-box').value;
  const operator = document.querySelector('input[name=operator]:checked').value;
  const params = new URLSearchParams({ q, operator, limit: '20' });
  for (const term of state.selectedTerms) params.append('term', term);
  const results = document.getElementById('search-results');
  results.textContent = 'Searching…';
  const res = await fetch('/api/search?' + params.toString());
  const data = await res.json();
  if (!data.hits || data.hits.length === 0) { results.textContent = 'No results.'; return; }
  const rows = data.hits.map(hit => `
    <tr>
      <td><strong>${hit.brand_name || '(no brand name)'}</strong><br><span style="color:#555">${hit.generic_name || ''}</span></td>
      <td>${hit.snippet || ''}</td>
      <td class="hit-tags">${(hit.tags || []).map(t => `<span>${t}</span>`).join('')}</td>
      <td>${hit.effective_time || ''}</td>
    </tr>`).join('');
  results.innerHTML = `<table><thead><tr><th>Drug</th><th>Snippet</th><th>PDLA tags</th><th>Effective</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function runCheck() {
  const medications = document.getElementById('med-box').value;
  const results = document.getElementById('check-results');
  results.textContent = 'Checking…';
  const res = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ medications, use_rxnorm: true }) });
  const data = await res.json();
  document.getElementById('notice-line').textContent = data.notice || '';
  let html = '';
  if (data.medication_table && data.medication_table.length) {
    const rows = data.medication_table.map(row => `
      <tr>
        <td>${row.as_entered}</td>
        <td>${row.matched_name ? row.matched_name.join(' → ') : 'Not resolved'}</td>
        <td>${(row.generic || []).join(', ')}</td>
        <td>${(row.base_ingredients || []).join(', ')}</td>
        <td>${(row.brand || []).join(', ')}</td>
        <td>${row.fda_class}</td>
        <td>${(row.route || []).join(', ')}</td>
        <td>${row.dea_schedule || ''}</td>
        <td>${row.daily_total != null ? row.daily_total + ' ' + (row.daily_total_unit || '') : ''}</td>
        <td>${(row.pdla_tags || []).map(t => `<span class="tag-pill">${t.term_id}</span>`).join('')}</td>
      </tr>`).join('');
    html += `<table><thead><tr><th>As entered</th><th>Matched name</th><th>Generic</th><th>Base ingredients</th><th>Brand</th><th>FDA class</th><th>Route</th><th>DEA schedule</th><th>Daily total</th><th>PDLA tags</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if (data.alerts && data.alerts.length) {
    html += '<h3>Alerts</h3>' + data.alerts.map(alert => `
      <div class="alert ${tierClass(alert.tier)}">
        <strong>${alert.title}</strong> &mdash; ${alert.tier_name}
        ${alert.members.map(m => `<div class="member">${m.drug_name} (${m.section || 'duplication'}): "${m.sentence}" &mdash; <a href="${m.dailymed_url}" target="_blank" rel="noopener">DailyMed</a></div>`).join('')}
      </div>`).join('');
  } else {
    html += `<p>${data.no_warning_text || 'No warning found in the labels checked.'}</p>`;
  }
  if (data.unresolved_entries && data.unresolved_entries.length) {
    html += '<h3>Unresolved entries</h3>' + data.unresolved_entries.map(entry => `
      <div class="unresolved">"${entry.raw_text}" &mdash; ${entry.reason}${entry.candidates.length ? ' (candidates: ' + entry.candidates.join('; ') + ')' : ''}</div>`).join('');
  }
  results.innerHTML = html;
}

document.getElementById('search-button').addEventListener('click', runSearch);
document.getElementById('check-button').addEventListener('click', runCheck);
loadTerms();
</script>
</body>
</html>
