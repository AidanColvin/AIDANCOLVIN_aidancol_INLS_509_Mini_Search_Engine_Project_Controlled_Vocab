[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rx_label_search"
version = "0.1.0"
description = "Search, tag, and interaction-check FDA prescription drug labels from openFDA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aidan Colvin" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rx-label-search = "rx_label_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
